# A push to main publishes the site. What it does not do is reach the server:
# this job builds the pages and attaches them to a GitHub Release, and the box
# notices the release and pulls it. Nothing here holds a credential for that
# machine, and nothing here connects to it.
#
# That direction is the whole security decision, and it is the same one the
# application repository makes for the API — see docs/runbooks/vps-architecture.md
# there. A push-based deploy needs a key with access to the box stored in
# GitHub, which makes a GitHub compromise a root shell on the machine that also
# runs Postgres. A static page is not worth that, so the page travels and the
# key does not exist.
#
# This creates the release and attaches the tarball in one run, rather than
# building when a release appears. A release that exists before its assets do
# is a release the server will see and be unable to fetch, every five minutes,
# until the upload finishes.
name: Publish the site

on:
  push:
    branches: [main]
    # A change to prose about the site is not a change to the site. Without
    # this, editing this comment would cut a release.
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: write

# Two pushes a minute apart cut two releases, and the box takes the newer one.
# What must not happen is a run being cancelled between creating a release and
# uploading its assets, which would leave a release the box can never fetch.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The tarball holds the contents of dist/, not dist/ itself, so the
      # server unpacks it straight into the release directory it serves.
      - name: Pack
        id: pack
        run: |
          set -eu
          tag="site-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          tar -czf site.tar.gz -C dist .
          sha256sum site.tar.gz | cut -d' ' -f1 > site.tar.gz.sha256
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$tag"
          cat site.tar.gz.sha256

      # The digest is published beside the tarball so the box can check what it
      # downloaded. It proves the transfer, not the source: both come from the
      # same place. What it catches is a truncated download being unpacked over
      # a working site.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pack.outputs.tag }}" \
            --title "${{ steps.pack.outputs.tag }}" \
            --notes "Built from ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            site.tar.gz site.tar.gz.sha256
